name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax check
        run: bash -n doctor.sh
      - name: shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck doctor.sh
          else
            sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck doctor.sh
          fi
